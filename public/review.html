<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a Review | Vancouver Peaks Journey</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:30px;
}

.card{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:18px;
border:2px solid #d4a017;
}

h1{
color:#071d35;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

button{
margin-top:20px;
padding:14px 24px;
background:#071d35;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#message{
margin-top:20px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>Leave a Review ⭐</h1>

<p>Thank you for joining Vancouver Peaks Journey.</p>

<label>Your Name</label>
<input id="customerName" placeholder="Sarah M">

<label>Country</label>
<input id="country" placeholder="Australia">

<label>Tour</label>
<select id="tour">
<option value="">Select Tour</option>
<option>Sea to Sky Gondola</option>
<option>Grouse Mountain</option>
<option>Whistler Adventure</option>
<option>Whistler + Sea to Sky Add-On</option>
</select>

<label>Tour Leader</label>
<select id="tourLeader">
<option value="">Select Tour Leader</option>
<option>Hamed</option>
<option>Arash</option>
<option>Mohammad</option>
<option>Shirin</option>
<option>Masoud</option>
</select>
<label>Rating</label>
<select id="rating">
<option value="">Select Rating</option>
<option value="5">★★★★★ 5</option>
<option value="4">★★★★☆ 4</option>
<option value="3">★★★☆☆ 3</option>
<option value="2">★★☆☆☆ 2</option>
<option value="1">★☆☆☆☆ 1</option>
</select>

<label>Comment</label>
<textarea id="comment" rows="5" placeholder="Tell us about your experience..."></textarea>

<button id="submitReview">Submit Review</button>

<div id="message"></div>

</div>

<script>

const SUPABASE_URL = "https://fmzyvslflsngnorpmuju.supabase.co";
const SUPABASE_KEY = "sb_publishable_RTM95bE519jtHrELvHSwrQ_FuTR7Ehg";

document.getElementById("submitReview").onclick = async () => {

const customer_name =
document.getElementById("customerName").value.trim();

const country =
document.getElementById("country").value.trim();

const tour =
document.getElementById("tour").value;

const tour_leader =
document.getElementById("tourLeader").value;

const rating =
Number(document.getElementById("rating").value);

const comment =
document.getElementById("comment").value.trim();

const message =
document.getElementById("message");

if(
!customer_name ||
!country ||
!tour ||
!tour_leader ||
!rating ||
!comment
){
message.style.color="red";
message.textContent="Please complete all fields.";
return;
}

const response = await fetch(
`${SUPABASE_URL}/rest/v1/reviews`,
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":`Bearer ${SUPABASE_KEY}`,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},
body:JSON.stringify({
customer_name,
country,
tour,
tour_leader,
rating,
comment,
approved:false
})
}
);

if(response.ok){
message.style.color="green";
message.textContent="Review submitted successfully.";

document.getElementById("customerName").value="";
document.getElementById("country").value="";
document.getElementById("tour").value="";
document.getElementById("tourLeader").value="";
document.getElementById("rating").value="";
document.getElementById("comment").value="";
}
else{
message.style.color="red";
message.textContent="Error submitting review.";
}

};

</script>

</body>
</html>
